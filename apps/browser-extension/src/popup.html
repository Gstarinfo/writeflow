<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WriteFlow Popup</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0d1117;
        color: #f0f6fc;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
        color: #58a6ff;
        margin-bottom: 4px;
      }
      .subtitle {
        font-size: 11px;
        color: #8b949e;
        margin-bottom: 16px;
      }
      .status-box {
        padding: 10px;
        background: #161b22;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 6px;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .btn-web {
        margin-top: 14px;
        width: 100%;
        padding: 8px;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="title">WriteFlow Assistant</div>
    <div class="subtitle">100% Local English Grammar & Synonyms</div>
    <div class="status-box">
      <div>🛡️ <strong>Privacy:</strong> On-device processing</div>
      <div>⚡ <strong>Engines:</strong> nlprule + WordNet</div>
      <div>🟢 <strong>Status:</strong> Active</div>
    </div>
    <button id="open-editor-btn" class="btn-web">Open Web Editor</button>
    <script type="module" src="./popup.tsx"></script>
  </body>
</html>
